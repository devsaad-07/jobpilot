# Company registry: aliases (for dedup), ATS board slugs (for discovery), comp band (for the
# ≥60 LPA gate when a posting has no salary).
#
# band_lpa = [low, high] total yearly comp (fixed + variable + annualised stock) for an
# SDE-3 / Senior SWE in India, in lakhs. THE SEEDED NUMBERS ARE ROUGH ESTIMATES, NOT RESEARCH —
# check each against Levels.fyi / AmbitionBox / people you know and edit. `band_verified: true`
# marks the ones you've checked; the report lists unverified bands that drove an apply decision.
#
# ats: auto → `jobpilot probe-ats` tries each slug on Greenhouse, Lever, Ashby, Workable and
# records the one that answers in data/ats_resolved.json. Pin with e.g. `ats: greenhouse`.
#
# workday: <careers URL> → the company's *.myworkdayjobs.com site. Open the company's careers page,
# click through to the job search, and paste the URL up to the site name, e.g.
#   https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
# `probe-ats` checks each one answers. The seeded URLs below are ones I believe are right but
# couldn't verify from my sandbox — probe-ats will flag any that are wrong.

defaults:
  band_verified: false

