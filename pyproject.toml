[project]
name = "jobpilot"
version = "0.1.0"
description = "Personal job-application pipeline: discover, validate fit, dedup, fill, verify, submit with proofs."
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45",
  "httpx>=0.27",
  "PyYAML>=6",
  "rapidfuzz>=3",
]

[project.optional-dependencies]
jobspy = ["python-jobspy>=1.1.80"]
laya = ["laya-mlx"]          # Apple Silicon only
dev = ["pytest>=8"]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
