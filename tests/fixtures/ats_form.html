<!doctype html><html><head><meta charset="utf-8"><title>Apply — Senior Backend Engineer</title>
<style>body{font-family:sans-serif;max-width:720px;margin:20px auto} label{display:block;margin-top:12px} .hidden-file{position:absolute;left:-9999px}</style></head>
<body>
<h1>Senior Backend Engineer</h1>
<form id="application" onsubmit="event.preventDefault(); submitIt();">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <label for="phone">Phone *</label><input id="phone" name="phone" type="tel" required MASK>
  <div><label>Resume/CV *</label>
    <input class="hidden-file" id="resume" name="resume" type="file" accept=".pdf" required
      onchange="document.getElementById('fname').innerText=this.files[0].name">
    <button type="button" onclick="document.getElementById('resume').click()">Attach</button> <span id="fname"></span></div>
  <label for="li">LinkedIn Profile</label><input id="li" name="urls[LinkedIn]">
  <label for="ctc">Current CTC (LPA) *</label><input id="ctc" name="ctc" type="number" required>
  <label for="ectc">Expected CTC (LPA) *</label><input id="ectc" name="ectc" type="number" required>
  <label for="notice">Notice period (days) *</label><input id="notice" name="notice" required>
  <label for="yoe">Years of experience *</label>
  <select id="yoe" name="yoe" required><option value="">Select...</option><option>0-2 years</option><option>3-5 years</option><option>6-8 years</option><option>9+ years</option></select>
  <label for="src">How did you hear about us?</label>
  <select id="src" name="src"><option value="">Select...</option><option>Company careers page</option><option>LinkedIn</option><option>Referral</option></select>
  <fieldset><legend>Are you legally authorized to work in India? *</legend>
    <label><input type="radio" name="auth" value="1" required> Yes</label>
    <label><input type="radio" name="auth" value="0"> No</label></fieldset>
  <fieldset><legend>Will you now or in the future require visa sponsorship? *</legend>
    <label><input type="radio" name="spon" value="1" required> Yes</label>
    <label><input type="radio" name="spon" value="0"> No</label></fieldset>
  <label for="gender">Gender</label>
  <select id="gender" name="gender"><option value="">Select...</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select>
  WHY
  <label><input type="checkbox" id="consent" name="consent" required> I agree to the privacy policy *</label>
  <button type="submit">Submit application</button>
</form>
<script>
function submitIt(){ document.body.innerHTML = '<h1>Thank you for applying!</h1><p>We have received your application.</p>'; }
</script>
</body></html>
